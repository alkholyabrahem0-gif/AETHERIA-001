<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AETHERIA — Valley of the First Light</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading-screen"><div class="loader-content"><h1>AETHERIA</h1><p>Valley of the First Light</p><div class="spinner"></div><p id="load-status">تحميل العالم...</p></div></div>
<canvas id="game-canvas"></canvas>
<header id="hud-top">
  <div class="title-box"><span class="badge">WORLD BUILD 02</span><h2>Valley of the First Light</h2><p id="zone-hint">استكشف الوادي وابحث عن الحجر السحري</p></div>
  <div class="controls-top"><div id="fps-counter">FPS: --</div><select id="quality-select" aria-label="إعدادات الجودة"><option value="low">جودة منخفضة (A13)</option><option value="medium">جودة متوسطة</option><option value="high">جودة عالية</option></select></div>
</header>
<div id="interaction-toast" class="hidden"></div>
<div id="lore-modal" class="hidden"><div class="lore-card"><h3 id="lore-title"></h3><p id="lore-body"></p><button id="close-lore-btn">متابعة الاستكشاف</button></div></div>
<div id="mobile-controls"><div id="joystick-zone"><div id="joystick-base"><div id="joystick-stick"></div></div></div><div id="camera-touch-zone"></div><div id="action-buttons"><button id="interact-btn" class="action-btn interact hidden">تفاعل</button><button id="jump-btn" class="action-btn jump">قفز</button></div></div>
<footer id="hud-hint">اسحب العصا للحركة · اسحب يمين الشاشة لتدوير الكاميرا · اضغط قفز</footer>

{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
